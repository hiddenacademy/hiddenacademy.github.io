<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="HiddenAcademy : Formations et CTF pour apprendre la cybersécurité offensive et Linux." />
  <meta name="author" content="HiddenAcademy" />

  <!-- OpenGraph -->
  <meta property="og:title" content="HiddenAcademy – Cybersécurité & Formations" />
  <meta property="og:description" content="Apprends le hacking éthique, les bases Linux et les CTFs depuis une seule plateforme." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hiddenacademy.com" />
  <meta property="og:image" content="https://hiddenacademy.com/assets/img/og-image.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/ctf.css" />
  <link rel="icon" href="{{ site.baseurl }}/assets/img/favicon.ico" type="image/x-icon" />
  
  <!-- Mermaid CSS pour le rendu -->
  <style>
    .mermaid {
      background: transparent;
      margin: 20px 0;
      text-align: center;
      max-width: 100%;
      overflow: auto;
    }
    
    .mermaid svg {
      max-width: 100%;
      height: auto !important;
    }
    
    /* Correction pour l'affichage responsive */
    .mermaid-container {
      width: 100%;
      overflow-x: auto;
      padding: 10px 0;
    }
  </style>
</head>

<body>
  {% unless page.hide_nav %}{% include navbar.html %}{% endunless %}
  <main>{{ content }}</main>

  <!-- JS Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
  <script src="{{ site.baseurl }}/assets/js/ctf.js"></script>
  <script src="{{ site.baseurl }}/assets/js/filters.js"></script>

  <!-- Mermaid Configuration Optimisée -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <script>
    // Initialisation différée pour s'assurer que le DOM est complètement chargé
    function initializeMermaid() {
      mermaid.initialize({
        startOnLoad: true,
        theme: 'dark',
        securityLevel: 'loose',
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          curve: 'basis'
        },
        sequence: {
          useMaxWidth: true,
          showSequenceNumbers: false
        },
        themeCSS: `
          .mermaid .label {
            color: #ffffff !important;
          }
        `
      });
      
      // Forcer le rendu de tous les diagrammes Mermaid
      mermaid.run({
        querySelector: '.language-mermaid, .mermaid',
        nodes: document.querySelectorAll('.language-mermaid, .mermaid')
      }).catch(error => {
        console.warn('Mermaid rendering warning:', error);
      });
    }

    // Différentes méthodes pour s'assurer que Mermaid s'initialise correctement
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeMermaid);
    } else {
      initializeMermaid();
    }

    // Re-rendre après le chargement complet de la page
    window.addEventListener('load', function() {
      setTimeout(initializeMermaid, 100);
    });
  </script>
</body>
</html>
